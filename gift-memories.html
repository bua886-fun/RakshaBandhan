<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<title>Our Memories · For Anaa</title>
<style>
:root{
  --sky:#FFF3D6;
  --octopus:#4F8FE0;
  --octopus-dark:#3B6FBD;
  --gold:#F7B733;
  --coral:#F0654B;
  --leaf:#63B389;
  --ink:#26324A;
  --card:#FFFDF7;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  background:var(--sky);
  font-family:'Baloo 2', cursive;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1rem;
}
.wrap{max-width:700px;width:100%;text-align:center;}
.eyebrow{
  font-family:'Baloo 2',cursive;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#fff;background:var(--octopus);border:3px solid var(--ink);border-radius:50px;
  display:inline-block;padding:.2rem 1rem;font-size:.72rem;margin-bottom:.7rem;
}
h1{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.9rem;margin:.1rem 0 .4rem;color:var(--coral);}
.sub{font-family:'Caveat',cursive;font-weight:700;font-size:1.3rem;margin-bottom:1.6rem;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
.frame{
  background:var(--card);border:5px solid var(--ink);border-radius:22px;
  aspect-ratio:1/1;overflow:hidden;box-shadow:0 6px 0 var(--ink);color:#8a93a8;
}
.frame img{width:100%;height:100%;display:block;object-fit:cover;}
.frame .icon{font-size:2.4rem;}
.frame .label{font-family:'Baloo 2',cursive;font-weight:700;font-size:.75rem;letter-spacing:.5px;text-transform:uppercase;}
.frame:nth-child(1){box-shadow:0 6px 0 var(--gold);}
.frame:nth-child(2){box-shadow:0 6px 0 var(--coral);}
.frame:nth-child(3){box-shadow:0 6px 0 var(--leaf);}
.frame:nth-child(4){box-shadow:0 6px 0 var(--octopus);}
.back{
  display:inline-block;margin-top:1.8rem;text-decoration:none;color:var(--ink);
  font-family:'Baloo 2',cursive;font-weight:700;font-size:.85rem;letter-spacing:.5px;text-transform:uppercase;
  border:3px solid var(--ink);border-radius:16px;padding:.6rem 1.3rem;background:#fff;
  box-shadow:0 4px 0 var(--ink); transition:transform .15s ease, box-shadow .15s ease;
}
.back:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);}
@media (max-width:600px){
  body{align-items:flex-start;padding:1.25rem .75rem;}
  h1{font-size:clamp(1.45rem,7vw,1.9rem);}
  .sub{font-size:1.15rem;margin-bottom:1.1rem;}
  .grid{grid-template-columns:1fr;gap:1rem;}
  .frame{width:min(100%,340px);justify-self:center;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Gift Box 1</div>
  <h1>A Few of Our Favorite Moments</h1>
  <p class="sub">(tiny snapshots, huge memories!)</p>
  <div class="grid">
    <div class="frame"><img src="Photo-1.JPG" alt="Photo 1 memory"></div>
    <div class="frame"><img src="Photo-2.jpg" alt="Photo 2 memory"></div>
    <div class="frame"><img src="Photo-3.jpg" alt="Photo 3 memory"></div>
    <div class="frame"><img src="Photo-4.webp" alt="Photo 4 memory"></div>
  </div>
  <a class="back" href="rakhi-final.html">&larr; Back to gifts</a>
</div>
</body>
</html>
